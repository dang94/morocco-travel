<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "background": "#111317",
                    "on-tertiary": "#581e00",
                    "inverse-surface": "#e2e2e8",
                    "secondary": "#ffb4a5",
                    "outline-variant": "#434653",
                    "inverse-on-surface": "#2f3035",
                    "primary-container": "#0047ab",
                    "tertiary-container": "#7f3916",
                    "tertiary-fixed": "#ffdbcd",
                    "on-tertiary-fixed-variant": "#76320f",
                    "on-primary-fixed": "#001946",
                    "surface-tint": "#b1c5ff",
                    "surface": "#111317",
                    "on-error": "#690005",
                    "on-tertiary-fixed": "#360f00",
                    "primary-fixed-dim": "#b1c5ff",
                    "on-surface": "#e2e2e8",
                    "on-primary": "#002c70",
                    "error": "#ffb4ab",
                    "tertiary": "#ffb596",
                    "inverse-primary": "#2559bd",
                    "surface-dim": "#111317",
                    "surface-container-low": "#1a1c20",
                    "secondary-fixed": "#ffdad3",
                    "surface-container": "#1e2024",
                    "on-background": "#e2e2e8",
                    "on-error-container": "#ffdad6",
                    "on-primary-container": "#a5bdff",
                    "on-secondary-fixed": "#3e0500",
                    "on-secondary-fixed-variant": "#802918",
                    "surface-variant": "#333539",
                    "secondary-container": "#802918",
                    "on-primary-fixed-variant": "#00419e",
                    "outline": "#8d909e",
                    "surface-container-high": "#282a2e",
                    "surface-bright": "#37393e",
                    "secondary-fixed-dim": "#ffb4a5",
                    "on-tertiary-container": "#ffaa86",
                    "tertiary-fixed-dim": "#ffb596",
                    "surface-container-highest": "#333539",
                    "surface-container-lowest": "#0c0e12",
                    "on-secondary-container": "#ff9a85",
                    "error-container": "#93000a",
                    "on-surface-variant": "#c3c6d5",
                    "primary-fixed": "#dae2ff",
                    "primary": "#b1c5ff", // Majorelle Blue (mapped to primary)
                    "on-secondary": "#611205"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "24px",
                    "lg": "48px",
                    "base": "8px",
                    "md": "24px",
                    "sm": "12px",
                    "xl": "80px",
                    "margin-desktop": "64px",
                    "margin-mobile": "16px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "label-md": ["Montserrat"],
                    "display-lg": ["Montserrat"],
                    "body-lg": ["Montserrat"],
                    "headline-lg-mobile": ["Montserrat"],
                    "body-md": ["Montserrat"],
                    "headline-sm": ["Montserrat"],
                    "headline-lg": ["Montserrat"],
                    "headline-md": ["Montserrat"],
                    "label-lg": ["Montserrat"],
                    "body-sm": ["Montserrat"]
            },
            "fontSize": {
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .geometric-overlay {
            background-image: radial-gradient(circle at 2px 2px, rgba(177, 197, 255, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }
        .glass-card {
            background: rgba(30, 32, 36, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(177, 197, 255, 0.1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md selection:bg-secondary-container selection:text-on-secondary-container overflow-x-hidden">
<header class="fixed top-0 left-0 w-full z-50 bg-surface/80 backdrop-blur-md border-b border-primary/10 flex justify-between items-center px-margin-mobile py-sm">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</div>
</header>
<main class="pt-[60px] pb-32">
<!-- Hero Section: Casablanca Context -->
<section class="relative h-[530px] flex flex-col justify-end px-margin-mobile pb-lg overflow-hidden">
<div class="absolute inset-0 z-0">
<img alt="Hassan II Mosque" class="w-full h-full object-cover" data-alt="A grand, cinematic view of the Hassan II Mosque in Casablanca at sunrise, its minaret piercing the soft morning mist. The Atlantic Ocean waves crash gently against the stone foundation in the foreground. The lighting is ethereal and high-contrast, with deep oceanic blues in the shadows and vibrant golden light hitting the intricate stone carvings. The aesthetic is premium and travel-focused, reflecting a sophisticated atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAU4r2DYnFIoSYzEYfI5cTvbg_ItZU8bGXSP1fVs5fFJuDdR1egT4UP_x-I3fMW6Z1Jnz_gD51GPUfn4CQSd0QnDKDw7E0VyxhFMAEAtkRMLEALUbthHPpZeKBT6JV10c8DxVLta6kzEA9CVBgzWYValJVlbSwOsTOfzpRGASWtNGvKK1AOyc1bvWyf_YscUmXTFzDB7ofQBe5Ti3t-Aly4zpCkJWDQmAu73wBSpHEuPgTpSj0srvhB8Gmrdl6oHV6XME9jsO4qmaE"/>
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/40 to-transparent"></div>
<div class="absolute inset-0 geometric-overlay opacity-30"></div>
</div>
<div class="relative z-10">
<h1 class="font-display-lg text-display-lg mb-xs">Casablanca</h1>
<div class="flex items-baseline gap-md">
<span class="text-[64px] leading-none font-light text-primary">24°C</span>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-secondary">Sunny</span>
<span class="font-body-md text-on-surface-variant">RealFeel 26°</span>
</div>
</div>
</div>
</section>
<!-- Weather Insights Bento Grid -->
<section class="px-margin-mobile mt-lg space-y-md">
<div class="grid grid-cols-2 gap-md">
<!-- Wind Speed -->
<div class="glass-card rounded-xl p-md relative overflow-hidden">
<div class="absolute top-0 right-0 p-xs opacity-10">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="air">air</span>
</div>
<span class="font-label-md text-label-md text-outline block mb-base uppercase tracking-wider">Wind</span>
<span class="font-headline-md text-headline-md text-on-surface">18 km/h</span>
<span class="font-body-sm text-secondary block mt-xs">NW Gusty</span>
</div>
<!-- Humidity -->
<div class="glass-card rounded-xl p-md relative overflow-hidden">
<div class="absolute top-0 right-0 p-xs opacity-10">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="humidity_mid">humidity_mid</span>
</div>
<span class="font-label-md text-label-md text-outline block mb-base uppercase tracking-wider">Humidity</span>
<span class="font-headline-md text-headline-md text-on-surface">62%</span>
<span class="font-body-sm text-secondary block mt-xs">Optimal</span>
</div>
</div>
<!-- 5-Day Outlook Glass Card -->
<div class="glass-card rounded-xl p-md border-t-2 border-primary/30">
<div class="flex justify-between items-center mb-md">
<h2 class="font-headline-md text-headline-md text-primary">5-Day Outlook</h2>
<span class="material-symbols-outlined text-secondary" data-icon="calendar_month">calendar_month</span>
</div>
<div class="space-y-4">
<!-- Day 1 (Today) -->
<div class="flex items-center justify-between py-2 border-b border-outline-variant/20">
<span class="font-body-md text-on-surface w-20">Today</span>
<span class="material-symbols-outlined text-secondary" data-icon="wb_sunny">wb_sunny</span>
<div class="flex gap-4 w-24 justify-end">
<span class="font-body-md font-bold text-on-surface">24°</span>
<span class="font-body-md text-on-surface-variant">16°</span>
</div>
</div>
<!-- Day 2 -->
<div class="flex items-center justify-between py-2 border-b border-outline-variant/20">
<span class="font-body-md text-on-surface-variant w-20">Mon</span>
<span class="material-symbols-outlined text-primary" data-icon="partly_cloudy_day">partly_cloudy_day</span>
<div class="flex gap-4 w-24 justify-end">
<span class="font-body-md font-bold text-on-surface">22°</span>
<span class="font-body-md text-on-surface-variant">15°</span>
</div>
</div>
<!-- Day 3 -->
<div class="flex items-center justify-between py-2 border-b border-outline-variant/20">
<span class="font-body-md text-on-surface-variant w-20">Tue</span>
<span class="material-symbols-outlined text-secondary" data-icon="wb_sunny">wb_sunny</span>
<div class="flex gap-4 w-24 justify-end">
<span class="font-body-md font-bold text-on-surface">26°</span>
<span class="font-body-md text-on-surface-variant">17°</span>
</div>
</div>
<!-- Day 4 -->
<div class="flex items-center justify-between py-2 border-b border-outline-variant/20">
<span class="font-body-md text-on-surface-variant w-20">Wed</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="cloud">cloud</span>
<div class="flex gap-4 w-24 justify-end">
<span class="font-body-md font-bold text-on-surface">21°</span>
<span class="font-body-md text-on-surface-variant">14°</span>
</div>
</div>
<!-- Day 5 -->
<div class="flex items-center justify-between py-2">
<span class="font-body-md text-on-surface-variant w-20">Thu</span>
<span class="material-symbols-outlined text-secondary" data-icon="wb_sunny">wb_sunny</span>
<div class="flex gap-4 w-24 justify-end">
<span class="font-body-md font-bold text-on-surface">25°</span>
<span class="font-body-md text-on-surface-variant">16°</span>
</div>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter pt-sm pb-8 border-t border-primary/20 bg-surface-container-high/90 backdrop-blur-xl">
<!-- Weather Active Tab -->
<a class="flex flex-col items-center justify-center text-primary transition-all duration-300" href="#">
<span class="material-symbols-outlined font-bold" data-icon="cloudy">cloudy</span>
<span class="font-label-md text-label-md mt-1">Weather</span>
</a>
<!-- Cities Tab -->
<a class="flex flex-col items-center justify-center text-outline hover:text-secondary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
<span class="font-label-md text-label-md mt-1">Cities</span>
</a>
<!-- Tips Tab -->
<a class="flex flex-col items-center justify-center text-outline hover:text-secondary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="lightbulb">lightbulb</span>
<span class="font-label-md text-label-md mt-1">Tips</span>
</a>
</nav>
</body></html>
